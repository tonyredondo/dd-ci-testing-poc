name: Compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential:
    name: differential (${{ matrix.os }}, ${{ matrix.go }}, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.26.x'
            mode: normal
          - os: ubuntu-latest
            go: '1.26.x'
            mode: race
          - os: ubuntu-latest
            go: '1.27.x'
            mode: normal
          - os: ubuntu-latest
            go: '1.27.x'
            mode: race
          - os: macos-latest
            go: '1.27.x'
            mode: normal
          - os: windows-latest
            go: '1.27.x'
            mode: normal
    runs-on: ${{ matrix.os }}
    # Fuzz lifecycle fixtures run many subprocesses. Race-enabled children also
    # wait for the race detector at exit; retain that wait and allow the complete
    # matrix to finish. Windows needs extra time for cold fixture compilation.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || matrix.os == 'macos-latest' && 45 || matrix.mode == 'race' && 45 || 35 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: testdata/fixture/go.sum
      - name: Install frozen Orchestrion reference
        shell: bash
        run: |
          go install github.com/DataDog/orchestrion@v1.13.2-0.20260917114356-5c24783fcd76
          reference="$(go env GOPATH)/bin/orchestrion"
          if [[ "$RUNNER_OS" == "Windows" ]]; then reference="$reference.exe"; fi
          echo "ORCHESTRION_BIN=$reference" >> "$GITHUB_ENV"
      - name: Verify incorporated sources and licenses
        shell: bash
        run: |
          python scripts/upstream.py verify
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Verify modules and driver dependency boundary
        shell: bash
        run: |
          (cd testdata/fixture && go mod download && go mod verify)
          python scripts/dependency_boundary.py
          go vet ./...
      - name: Unit, runtime and differential compatibility
        shell: bash
        env:
          PARITY_EXECUTION_ORDER: ${{ matrix.mode == 'race' && 'mini-first' || 'sdk-first' }}
          PARITY_REPORT_NAME: ${{ matrix.mode == 'race' && 'parity-race' || 'parity' }}
          PARITY_TEST_MODE: ${{ matrix.mode }}
          GO_TEST_TIMEOUT: ${{ matrix.os == 'windows-latest' && '55m' || matrix.os == 'macos-latest' && '40m' || matrix.mode == 'race' && '40m' || '30m' }}
        run: |
          mkdir -p artifacts
          set -o pipefail
          test_flags=()
          if [[ "$PARITY_TEST_MODE" == "race" ]]; then test_flags+=(-race); fi
          PARITY_REPORT_PATH="$PWD/artifacts/$PARITY_REPORT_NAME.json" go test "${test_flags[@]}" -v -count=1 -timeout="$GO_TEST_TIMEOUT" ./... 2>&1 | tee artifacts/compatibility.log
      - name: Publish CI feature parity evidence
        shell: bash
        env:
          PARITY_REPORT_NAME: ${{ matrix.mode == 'race' && 'parity-race' || 'parity' }}
        run: |
          python scripts/parity_report.py "artifacts/$PARITY_REPORT_NAME.json" --output "artifacts/$PARITY_REPORT_NAME.md"
          cat "artifacts/$PARITY_REPORT_NAME.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-${{ matrix.os }}-go-${{ matrix.go }}-${{ matrix.mode }}
          path: artifacts/
          retention-days: 7

  mini:
    name: mini (Linux, ${{ matrix.go }}, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: '1.25.x'
            mode: normal
          - go: '1.25.x'
            mode: race
          - go: 'tip'
            mode: normal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go == 'tip' && '1.27.x' || matrix.go }}
          cache-dependency-path: testdata/fixture/go.sum
      - name: Build Go tip
        if: matrix.go == 'tip'
        shell: bash
        run: |
          bootstrap="$(go env GOROOT)"
          git clone --depth=1 https://go.googlesource.com/go "$RUNNER_TEMP/go-tip"
          git -C "$RUNNER_TEMP/go-tip" rev-parse HEAD
          (cd "$RUNNER_TEMP/go-tip/src" && GOROOT_BOOTSTRAP="$bootstrap" ./make.bash)
          echo "$RUNNER_TEMP/go-tip/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Verify sources and dependency boundary
        shell: bash
        run: |
          python scripts/upstream.py verify
          python -m unittest discover -s scripts -p "test_*.py"
          python scripts/dependency_boundary.py
          go vet ./...
      - name: Native Mini runtime and integration
        shell: bash
        env:
          GOTOOLCHAIN: local
          PARITY_TEST_MODE: ${{ matrix.mode }}
          GO_MATRIX_VERSION: ${{ matrix.go }}
        run: |
          mkdir -p artifacts
          set -o pipefail
          go version
          test_flags=()
          if [[ "$PARITY_TEST_MODE" == "race" ]]; then test_flags+=(-race); fi
          # The SDK reference needs Go 1.26; frozen Orchestrion cannot serve as
          # a tip oracle. These jobs run Mini directly, without Orchestrion.
          mapfile -t packages < <(go list ./... | sed '/\/integration$/d')
          go test "${test_flags[@]}" -v -count=1 -timeout=10m "${packages[@]}" 2>&1 | tee artifacts/unit.log
          cases='TestMini(ToolchainFeatures|FuzzExampleLifecycle|PublicFuzzExampleAPI|PreservesConsumerLanguage|PreservesOlderConsumerDependencies|ModModeResolvesClientRequirements|ContinuesAfterPackageSetupFailures|LocalProvisionAvoidsProxy|ConsumerAddsOnlyOwnModule|RuntimeProvisionUsesModuleOverlay|ChdirSymlinkWithUserTool|GoleakAbsoluteTargetRetainsCompilerFlags|ModModeLeavesModuleFiles|ProvisionsWorkspaceWithoutChangingModules|ProvisionsVendorAndPreservesPatchedSources|GoleakIntegration|CoverageIncludesCleanup|StartupOverlapsSettingsAndTelemetry)$|^TestGoleakCacheAndWarmVersionGuard$'
          if [[ "$GO_MATRIX_VERSION" == "tip" ]]; then
            cases+='|^TestMini(SDKSpanMirror|SDKMirrorContextMatrix|UnsupportedSDKMirrorRetainsTestReporting|LegacySDKShim)$'
          fi
          go test "${test_flags[@]}" -v -count=1 -timeout=20m -run="$cases" ./integration 2>&1 | tee artifacts/mini.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mini-go-${{ matrix.go }}-${{ matrix.mode }}
          path: artifacts/
          retention-days: 7
