name: Release
# Publishing a GitHub release builds ddto at its tag, with the tag's version,
# and attaches the executables, install.sh and SHA256SUMS to it.
on:
  release:
    types: [published]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  release:
    name: Build and attach ddto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false
      # scripts/release rejects a tag that is not vMAJOR.MINOR.PATCH[-PRERELEASE].
      - name: Build
        shell: bash
        run: |
          go run ./scripts/release -version "$TAG" -o dist
          cp scripts/install.sh dist/
          cd dist && sha256sum ddto-* install.sh > SHA256SUMS
      - name: Check the executables and install.sh
        shell: bash
        run: |
          dist/ddto-linux-amd64 --help > /dev/null 2>&1
          grep -aq "TestOptimization.build $TAG" dist/ddto-linux-amd64
          DDTO_DOWNLOAD_URL="file://$PWD/dist" bash dist/install.sh --dir "$RUNNER_TEMP/bin"
          cmp dist/ddto-linux-amd64 "$RUNNER_TEMP/bin/ddto"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
